<!DOCTYPE html>
<html>
  <head>
    <title>Display Property</title>
    <link rel = "stylesheet" href = "display.css">
  </head>
  <body>
    <!-- Ex. 8a -->

    <input class = "name-box" type = "text" placeholder = "Name">
    <input class = "email-box" type = "text" placeholder = "Email">
    <hr>

    <!-- Ex. 8b -->

    <p class = "survey-para">
      Thanks for chatting with our customer support. Would you like to take our quick survey?
    </p>

    <button class = "survey-yes-button">
      Yes
    </button>

    <button class = "survey-no-button">
      No
    </button>
    <hr>

    <!-- Ex. 8c -->

    <img class = "google-logo" src = "Google_logo.png" alt = "Google logo">
    <input class = "google-search-box" type = "text" placeholder = "Search Google or type a URL">
    <hr>

    <!-- Ex. 8d -->

    <input class = "first-name-box" type = "text" placeholder = "First name">
    <input class = "last-name-box" type = "text" placeholder = "Last name">
    <input class = "email-id-box" type = "email" placeholder = "Email">
    
    <button class = "sign-up-button">
      Sign Up
    </button>
    <hr>

    <!-- Ex. 8e -->

    <p class = "uber-heading">
      Request a ride now
    </p>

    <input class = "uber-pickup-location-box" type = "text" placeholder = "Enter pickup location">
    <input class = "uber-destination-box" type = "text" placeholder = "Enter destination">

    <button class = "uber-request-now-button">
      Request now
    </button>

    <button class = "uber-schedule-for-later-button">
      Schedule for later
    </button>
    <hr>
  </body>
</html>
