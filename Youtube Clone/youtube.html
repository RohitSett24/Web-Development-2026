<!DOCTYPE html>
<html>
  <head>
    <title>Youtube Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel = "stylesheet" href = "youtube.css">
  </head>
  <body>
    <!-- Video Preview Card 1-->
    <div class = "video-preview">

      <div>
        <img class = "video-thumbnail" src = "thumbnails/thumbnail-1.webp">
      </div>

      <div class = "video-content-row">
        <div class = "channel-pic">
          <img class = "creator-profile-pic" src = "channels/channel-1.jpeg">
        </div>
        
        <div class = "video-info">
          <p class = "video-title">
            Talking Tech and AI with Google CEO Sundar Pichai!
          </p>

          <p class = "video-creator">
            Marques Brownlee
          </p>

          <p class = "video-stats">
            3.4M views &middot; 6 months ago
          </p>
        </div>
      </div>
    </div>  

    <!-- Video Preview Card 2-->
    <div class = "video-preview">

      <div>
        <img class = "video-thumbnail" src = "thumbnails/thumbnail-2.webp">
      </div>

      <div class = "video-content-row">
        <div class = "channel-pic">
          <img class = "creator-profile-pic" src = "channels/channel-2.jpeg">
        </div>

        <div class = "video-info">
          <p class = "video-title">
            Try Not To Laugh Challenge #9
          </p>

          <p class = "video-creator">
            Markiplier
          </p>
          
          <p class = "video-stats">
            19M views &middot; 4 years ago
          </p>
        </div>
      </div>
    </div>


  </body>
</html>
