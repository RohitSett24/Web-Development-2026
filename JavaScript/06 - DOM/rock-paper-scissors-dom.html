<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <p>
      Rock Paper Scissors
    </p>

    <button onclick = "
      playGame('Rock');
    ">
      Rock
    </button>

    <button onclick = "
      playGame('Paper');
    ">
      Paper
    </button>

    <button onclick = "
      playGame('Scissors');
    ">
      Scissors
    </button>

    <p class = 'js-result'></p>

    <p class = 'js-choices'></p>

    <p class = 'js-score'></p> 

    <button onclick = "
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;

      localStorage.removeItem('score');

      updateScoreElement();
    ">
      Reset Score
    </button>

    <script>
      let score = JSON.parse(localStorage.getItem('score')) 
      || {
        wins: 0,
        losses: 0,
        ties: 0
      };

      updateScoreElement();

      function updateScoreElement() {
        document.querySelector('.js-score').innerHTML = `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
      }

      function pickComputerChoice() {
        let randomNumber = Math.random();

        let compChoice;

        if (randomNumber >= 0 && randomNumber < 1/3) {
          compChoice = 'Rock';
        } else if (randomNumber >= 1/3 && randomNumber < 2/3) {
          compChoice = 'Paper';
        } else if (randomNumber >= 2/3 && randomNumber < 1) {
          compChoice = 'Scissors';
        }

        return compChoice;
      }

      function playGame(myChoice) {
        let compChoice = pickComputerChoice ();
        
        let result = '';

        if (compChoice === myChoice) {
          result = 'Tie.';
        } else if ((myChoice === 'Rock' && compChoice === 'Scissors') || (myChoice === 'Paper' && compChoice === 'Rock') || (myChoice === 'Scissors' && compChoice === 'Paper')) {
          result = 'You win.';
        } else {
          result = 'You lose.';
        }

        if(result === 'You win.') {
          score.wins += 1;
        } else if (result === 'You lose.') {
          score.losses += 1;
        } else if (result === 'Tie.') {
          score.ties += 1;
        }

        localStorage.setItem('score', JSON.stringify(score));

        document.querySelector('.js-result').innerHTML = result;
        
        document.querySelector('.js-choices').innerHTML = `You ${myChoice} - ${compChoice} Computer`;

        updateScoreElement();
      }
    </script>
  </body>
</html>
