<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Projects</title>
    <style>
      p {
        font-family: Arial;
      }

      .yt-sub-btn {
        background-color: black;
        color: white;
        font-weight: bold;
        border: none;
        padding: 10px 15px;
        border-radius: 20px;
        cursor: pointer;
        margin-bottom: 35px;
      }

      .is-subscribed {
        background-color: rgb(240, 240, 240);
        color: black;
      }

      .cost-inp-box {
        font-size: 15px;
        padding: 10px;
      }

      .calc-btn {
        background-color: green;
        color: white;
        border: none;
        font-size: 15px;
        padding: 12px 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Proj. 1-->
    <p class = "yt-sub-text">YouTube Subscribe Button</p>

    <button onclick = "
      subscribe();
    " class = "yt-sub-btn js-subscribe-button">
      Subscribe
    </button>

    <!-- Proj. 3-->
    <p>Amazon Shipping Calculator</p>
    <p>Orders under $40 = +$10 shipping.</p>
    <p>Orders over $40 = FREE shipping.</p>

    <input class = "cost-inp-box js-init-cost" type = "text" 
    placeholder = "Cost of order" onkeydown = "
      displayCostOnEnter(event);
    ">
    
    <button class = "calc-btn js-cal-btn" onclick = "
      calculateFinalCost();
    ">Calculate</button>
    
    <p class = "js-final-cost"></p>

    <br><br><br>

    <script>
      function subscribe() {
        const buttonElement = document.querySelector('.js-subscribe-button');
        
        if (buttonElement.innerText === 'Subscribe') {
          buttonElement.innerHTML = 'Subscribed';
          buttonElement.classList.add('is-subscribed');
        } else {
          buttonElement.innerHTML = 'Subscribe';
          buttonElement.classList.remove('is-subscribed');
        }
      }

      function calculateFinalCost() {
        const inputElement = document.querySelector('.js-init-cost');
        const initCost = Number(inputElement.value) * 100;

        let finalCost;

        if(initCost < 4000) {
          finalCost = (initCost + 1000)/100;
        } else {
          finalCost = initCost/100;
        }

        document.querySelector('.js-final-cost').innerHTML = `$${finalCost}`;
      }

      function displayCostOnEnter(event) {
        if(event.key === 'Enter') {
          calculateFinalCost();
        }
      }
    </script>
  </body>
</html>
