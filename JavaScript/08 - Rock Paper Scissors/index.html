<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel = "stylesheet" href = "style.css">
  </head>
  <body>
    <p class = "game-heading">
      Rock Paper Scissors
    </p>

    <button class = "move-btn" onclick = "
      playGame('rock');
    ">
      <img class = "move-img" src = "images/rock-emoji.png">
    </button>

    <button class = "move-btn" onclick = "
      playGame('paper');
    ">
      <img class = "move-img" src = "images/paper-emoji.png">
    </button>

    <button class = "move-btn" onclick = "
      playGame('scissors');
    ">
      <img class = "move-img" src = "images/scissors-emoji.png">
    </button>

    <p class = 'result js-result'></p>

    <p class = 'choices js-choices'></p>

    <p class = 'js-score'></p> 

    <button class = "reset-score-btn" onclick = "
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;

      localStorage.removeItem('score');

      updateScoreElement();
    ">
      Reset Score
    </button>

    <button class = "auto-play-btn js-auto-play-btn" onclick = "
      autoPlay();
    ">Auto Play</button>

    <script src = "script.js"></script>
  </body>
</html>
