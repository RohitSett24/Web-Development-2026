<!DOCTYPE html>
<html lang = "en">
  <head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <title>Cart Quantity</title>
  </head>
  <body>
    <p>
      Cart Quantity
    </p>

    <button onclick = "
      console.log(`Cart quantity: ${cartQuantity}`);
    ">
      Show Quantity
    </button>

    <button onclick = "
      updateCartQuantity('add', 1);
    ">
      Add to Cart
    </button> 

    <button onclick = "
      updateCartQuantity('add', 2);
    ">
      +2
    </button>

    <button onclick = "
      updateCartQuantity('add', 3);
    ">
      +3
    </button>

    <button onclick = "
      updateCartQuantity('add', 4);
    ">
      +4
    </button>

    <button onclick = "cartQuantity
      updateCartQuantity('add', 5);
    ">
      +5
    </button>

    <button onclick = "
      updateCartQuantity('remove', 1);
    ">
      Remove from cart
    </button>

    <button onclick = "
      updateCartQuantity('remove', 2);
    ">
      -2
    </button>

    <button onclick = "
      updateCartQuantity('remove', 3);
    ">
      -3
    </button>

    <button onclick = "
      cartQuantity = 0;
      console.log('Cart was reset.');
      console.log(`Cart quantity: ${cartQuantity}`);
    ">
      Reset Cart
    </button>

    <script>
      let cartQuantity = 0;

      function updateCartQuantity(updationType, noOfItems) {
        if(updationType === 'add') {
          if (cartQuantity + noOfItems > 10) {
            alert('You can add upto total of 10 items');
            return;
          }

          cartQuantity += noOfItems; 
          console.log(`Cart quantity: ${cartQuantity}`);
        }
        else if (updationType === 'remove') {
          if (cartQuantity - noOfItems < 0) {
            alert('Not enough items in the cart');
            return;
          }

          cartQuantity -= noOfItems;
          console.log(`Cart quantity: ${cartQuantity}`);
        }
      }
    </script>
  </body>
</html>
