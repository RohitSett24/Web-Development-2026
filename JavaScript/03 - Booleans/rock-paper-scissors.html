<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <p>
      Rock Paper Scissors
    </p>

    <button onclick = "
      myChoice = 'Rock';

      randomNumber = Math.random();

      if (randomNumber >= 0 && randomNumber < 1/3) {
        compChoice = 'Rock';
      } else if (randomNumber >= 1/3 && randomNumber < 2/3) {
        compChoice = 'Paper';
      } else if (randomNumber >= 2/3 && randomNumber < 1) {
        compChoice = 'Scissors';
      }

      if (compChoice === myChoice) {
        result = 'Tie.';
      } else if (compChoice === 'Scissors') {
        result = 'You win.';
      } else {
        result = 'You lose.';
      }

      alert(`You picked ${myChoice}. Computer picked ${compChoice}. ${result} `);
    ">
      Rock
    </button>

    <button onclick = "
      myChoice = 'Paper';

      randomNumber = Math.random();

      if (randomNumber >= 0 && randomNumber < 1/3) {
        compChoice = 'Rock';
      } else if (randomNumber >= 1/3 && randomNumber < 2/3) {
        compChoice = 'Paper';
      } else if (randomNumber >= 2/3 && randomNumber < 1) {
        compChoice = 'Scissors';
      }

      if (compChoice === myChoice) {
        result = 'Tie.';
      } else if (compChoice === 'Rock') {
        result = 'You win.';
      } else {
        result = 'You lose.';
      }

      alert(`You picked ${myChoice}. Computer picked ${compChoice}. ${result}`);
    ">
      Paper
    </button>

    <button onclick = "
      myChoice = 'Scissors';

      randomNumber = Math.random();

      if (randomNumber >= 0 && randomNumber < 1/3) {
        compChoice = 'Rock';
      } else if (randomNumber >= 1/3 && randomNumber < 2/3) {
        compChoice = 'Paper';
      } else if (randomNumber >= 2/3 && randomNumber < 1) {
        compChoice = 'Scissors';
      }

      if (compChoice === myChoice) {
        result = 'Tie.';
      } else if (compChoice === 'Paper') {
        result = 'You win.';
      } else {
        result = 'You lose.';
      }

      alert(`You picked ${myChoice}. Computer picked ${compChoice}. ${result}`);
    ">
      Scissors
    </button>


    <script>
      let myChoice;
      let compChoice;
      let result;
      let randomNumber;
    </script>
  </body>
</html>
