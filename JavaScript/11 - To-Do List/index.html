<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
    <link rel = "stylesheet" href = "style.css"> 
  </head>
  <body>
    <p>Todo List</p>
    
    <div class = "todo-input-grid">
      <input class = "todo-input-box js-todo-input" placeholder = "Todo name">

      <input class = "todo-date-box js-date" type = "date"> 

      <button class = "todo-add-button js-add-btn">
        Add
      </button>
    </div>
    
    <div class = "todo-grid js-todo-list"></div>

    <script src = "script.js"></script>
  </body>
</html>
