<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <p>
      Rock Paper Scissors
    </p>

    <button onclick = "
      playGame('Rock');
    ">
      Rock
    </button>

    <button onclick = "
      playGame('Paper');
    ">
      Paper
    </button>

    <button onclick = "
      playGame('Scissors');
    ">
      Scissors
    </button>


    <script>
      function pickComputerChoice() {
        let randomNumber = Math.random();

        let compChoice;

        if (randomNumber >= 0 && randomNumber < 1/3) {
          compChoice = 'Rock';
        } else if (randomNumber >= 1/3 && randomNumber < 2/3) {
          compChoice = 'Paper';
        } else if (randomNumber >= 2/3 && randomNumber < 1) {
          compChoice = 'Scissors';
        }

        return compChoice;
      }

      function playGame(myChoice) {
        let compChoice = pickComputerChoice ();
        
        let result = '';

        if (compChoice === myChoice) {
          result = 'Tie.';
        } else if ((myChoice === 'Rock' && compChoice === 'Scissors') || (myChoice === 'Paper' && compChoice === 'Rock') || (myChoice === 'Scissors' && compChoice === 'Paper')) {
          result = 'You win.';
        } else {
          result = 'You lose.';
        }

        alert(`You picked ${myChoice}. Computer picked ${compChoice}. ${result} `);
      }
    </script>
  </body>
</html>
