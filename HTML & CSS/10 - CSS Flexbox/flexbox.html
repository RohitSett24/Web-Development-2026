<!DOCTYPE html>
<html>
  <head>
    <title>CSS Flexbox</title>
    <link rel = "stylesheet" href = "flexbox.css">
  </head>
  <body>
    <!-- Ex. 12a -->
    <div class = "flexbox-1">
      <div class = "flexbox-1-box-1">200px</div>
      <div class = "flexbox-1-box-2">75px</div>
    </div>

    <hr>

    <!-- Ex. 12b -->
    <div class = "flexbox-2">
      <div class = "flexbox-2-box-1">item1</div>
      <div class = "flexbox-2-box-2">item2</div>
      <div class = "flexbox-2-box-3">item3</div>
    </div>

    <hr>

    <!-- Ex. 12c -->
    <div class = "flexbox-3">
      <div class = "flexbox-3-box-1">item1</div>
      <div class = "flexbox-3-box-2">item2</div>
      <div class = "flexbox-3-box-3">item3</div>
      <div class = "flexbox-3-box-4">item4</div>
    </div>

    <hr>

    <!-- Ex. 12d -->
    <div class = "flexbox-4">
      <div class = "flexbox-4-box-1">item1</div>
      <div class = "flexbox-4-box-2">item2</div>
    </div>

    <hr>

    <!-- Ex. 12e -->
    <div class = "home-notifications-messages-flexbox">
      <div class = "home-flexbox">
        <div class = "home">Home</div>
        <div class = "home-alerts">14</div>
      </div>

      <div class = "notifications-flexbox">
        <div class = "notifications">Notifications</div>
        <div class = "notifications-alerts">3</div>
      </div>

      <div class = "messages-flexbox">
        <div class = "messages">Messages</div>
        <div class = "messages-alerts">5</div>
      </div>
    </div>

    <hr>

  <!-- Ex. 12f -->

  <div class = "header-flexbox">
      <p class = "header-para">Home</p>
    
      <input class = "search-box" type = "text" placeholder = "Search">
    
      <button class = "download-button">Download</button>
  </div>

  <hr>

  <!-- Ex. 12g -->

  <div class = "animal-social-media-flexbox">
    <div class = "animal-flexbox">
      <img class = "animal-profile-pic" src = "cat-pic.jpg">

      <div>
        <p class = "animal-name">Oliver</p>
        <p class = "animal-tag">Naughty Cat</p>
        <p class = "animal-popularity">Popular</p>
      </div>

      <button class = "follow-button">Follow</button>
    </div>

    <div class = "animal-flexbox">
      <img class = "animal-profile-pic" src = "cat-pic2.jpg">

      <div>
        <p class = "animal-name">Mimi</p>
        <p class = "animal-tag">Sleepy Cat</p>
        <p class = "animal-popularity">Popular</p>
      </div>

      <button class = "follow-button">Follow</button>
    </div>

    <div class = "animal-flexbox">
      <img class = "animal-profile-pic" src = "dog-pic.jpg">

      <div>
        <p class = "animal-name">Rex</p>
        <p class = "animal-tag">Happy Dog</p>
        <p class = "animal-popularity">Popular</p>
      </div>

      <button class = "follow-button">Follow</button>
    </div>
  </div>
  </body>
</html>
