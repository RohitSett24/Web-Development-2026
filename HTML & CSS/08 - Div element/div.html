<!DOCTYPE html>
<html>
  <head>
    <title>Div exercise</title>
    <link rel = "stylesheet" href = "div.css">
  </head>
  <body>
    <!-- Ex. 9a -->

    <div class = "square-div"></div>

    <!-- Ex. 9b -->

    <div class = "circle-div"></div>

    <hr>

    <!-- Ex. 9c -->

    <div class = "feedback-box">
      
      <p class = "feedback-text">
        Satisfied with our service?
      </p>

      <button class = "feedback-yes-button">Yes</button>
      <button class = "feedback-no-button">No</button>
    
    </div>

    <hr>

    <!-- Ex. 9d -->

    <div class = "yt-music-container">
      
      <p class = "yt-music-para1">
        Install YouTube Music
      </p>

      <p class = "yt-music-para2">
        Add YouTube Music to your desktop for quick and easy access
      </p>

    </div>

    <hr>

    <!-- Ex. 9e -->

    <div class = "twitter-text-box-container">
      
      <img class = "twitter-profile-image" src = "cat-pic.jpg">
    
      <input class = "twitter-tweet-box" type = "text" placeholder = "What's happening?">

      <button class = "tweet-button">Tweet</button>
    
    </div>

    <hr>

    <!-- Ex. 9f & 9g -->

    <div class = "animal-card">

      <div>
        <img class = "animal-profile-pic" src = "cat-pic.jpg">
      </div>

      <div class = "animal-card-content">
        <p class = "animal-name">
          Oliver
        </p>
  
        <div>
          <div class = "mutual-friend-profile-pic-container">
            <img class = "mutual-friend-profile-pic" src = "dog-pic.jpg">
          </div>
  
          <p class = "animal-mutual-friends">
            2 mutual friends
          </p>
        </div>
        
        <div class = "animal-add-friend-button-container">
          <button class = "animal-add-friend-button">
            Add Friend
          </button>
        </div>
      </div>
    </div>

    <div class = "animal-card">

      <div>
        <img class = "animal-profile-pic" src = "cat-pic2.jpg">
      </div>

      <div class = "animal-card-content">
        <p class = "animal-name">
          Mimi
        </p>
  
        <div>
          <div class = "mutual-friend-profile-pic-container">
            <img class = "mutual-friend-profile-pic" src = "dog-pic.jpg">
          </div>
  
          <p class = "animal-mutual-friends">
            3 mutual friends
          </p>
        </div>
        
        <div class = "animal-add-friend-button-container">
          <button class = "animal-add-friend-button">
            Add Friend
          </button>
        </div>
      </div>
    </div>


    <div class = "animal-card">

      <div>
        <img class = "animal-profile-pic" src = "dog-pic.jpg">
      </div>

      <div class = "animal-card-content">
        <p class = "animal-name">
          Rex
        </p>
  
        <div>
          <div class = "mutual-friend-profile-pic-container">
            <img class = "mutual-friend-profile-pic" src = "dog-pic.jpg">
          </div>
  
          <p class = "animal-mutual-friends">
            4 mutual friends
          </p>
        </div>
        
        <div class = "animal-add-friend-button-container">
          <button class = "animal-add-friend-button">
            Add Friend
          </button>
        </div>
      </div>
    </div>
    
    
    <hr>

    <!-- Ex. 9h -->

    <div class = "google-search-layout">

      <div class = "google-logo-container">
        <img class = "google-logo" src = "Google_logo.png" alt = "Google logo">
      </div>

      <div class = "google-search-box-container">
        <input class = "google-search-box" type = "text" placeholder = "Search Google or type a URL">
      </div>
      
      <div class = "google-buttons-container">
        <button>
          Google Search
        </button>

        <button>
          I'm Feeling Lucky
        </button>
      </div>
    </div>

    <hr>
  </body>
</html>
